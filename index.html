<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الهندسية الموحدة - المكتبة والجدول</title>
    <!-- خط Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #f4f7fe;
            --bg-card: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.95);
            --text-main: #1b2559;
            --text-sub: #707ebe;
            --primary: #4318ff;
            --primary-hover: #3311db;
            --accent: #00d589;
            --border: #e9edf7;
            --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
        }

        [data-theme="dark"] {
            --bg-body: #0b1437;
            --bg-card: #111c44;
            --bg-header: rgba(17, 28, 68, 0.95);
            --text-main: #ffffff;
            --text-sub: #a3edda;
            --primary: #7551ff;
            --primary-hover: #5a32ea;
            --border: #1b254b;
            --shadow: 0px 18px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
        }

        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero {
            text-align: center;
            margin: 30px 0 20px 0;
        }

        .hero h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .hero p { color: var(--text-sub); font-size: 0.95rem; }

        /* أدوات التصفية */
        .filter-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .filter-item {
            flex: 1;
            min-width: 240px;
        }

        .filter-item label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        /* التبويبات */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* البطاقات والأزرار الفرعية */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--bg-body);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--border);
        }

        .badge.bio { color: var(--accent); }

        .subject-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .info-list {
            list-style: none;
            color: var(--text-sub);
            font-size: 0.92rem;
            margin-bottom: 18px;
        }

        .info-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .sub-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .sub-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(-3px);
        }

        .day-header {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 25px 0 15px 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 4px solid var(--primary);
            padding-right: 10px;
        }

        /* نافذة المودال */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            padding: 25px;
            box-shadow: var(--shadow);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .modal-title { font-size: 1.2rem; font-weight: 800; }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .resource-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--bg-body);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .resource-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-text {
            text-align: center;
            color: var(--text-sub);
            padding: 20px;
            font-weight: 600;
            grid-column: 1 / -1;
        }

        .retry-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-wrapper">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>المنصة الهندسية الموحدة</span>
            </div>
            <button class="theme-btn" id="themeBtn" title="تبديل المظهر">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>المكتبة الأكاديمية وجدول المحاضرات</h1>
            <p>اختر أي مادة لاستعراض المحاضرات المباشرة، التمارين، والملفات داخل الموقع مباشرة</p>
        </section>

        <!-- أدوات التصفية -->
        <div class="filter-card">
            <div class="filter-item">
                <label for="deptSelect"><i class="fa-solid fa-layer-group"></i> القسم الأكاديمي:</label>
                <select id="deptSelect" onchange="onFilterChange()">
                    <option value="all">جميع أقسام الهندسة (مشترك)</option>
                    <option value="biomedical">الهندسة الطبية الحيوية (Biomedical)</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="subjectSelect"><i class="fa-solid fa-book"></i> المادة الدراسية:</label>
                <select id="subjectSelect" onchange="onFilterChange()">
                    <option value="all">جميع المواد</option>
                </select>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('subjectsTab', this)">
                <i class="fa-solid fa-folder-open"></i> مواد سمستر 2 والمكتبة
            </button>
            <button class="tab-btn" onclick="switchTab('scheduleTab', this)">
                <i class="fa-solid fa-calendar-days"></i> جدول المحاضرات
            </button>
        </div>

        <!-- 1. تبويب المواد -->
        <div id="subjectsTab" class="tab-content active">
            <div id="subjectsContainer" class="grid">
                <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الملفات والمحاضرات من المكتبة...</div>
            </div>
        </div>

        <!-- 2. تبويب جدول المحاضرات -->
        <div id="scheduleTab" class="tab-content">
            <div id="scheduleContainer"></div>
        </div>
    </div>

    <!-- نافذة العرض المنبثقة -->
    <div class="modal-overlay" id="resourceModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">عنوان المحتوى</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- الروابط والملفات -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxNZjJbNQ-l7rtWHKSlD_zz3CTGCojgo9OiFF9jQmO9CsoJ-yJuPC4v7JiHFheXLN4/exec";

        const appData = {
            subjects: [
                {
                    id: 'physics2',
                    name: 'الفيزياء 2',
                    doc: 'د. الزبير جعفر',
                    isGeneral: true,
                    buttons: [
                        { title: 'روابط محاضرات الفيزياء', type: 'links', icon: 'fa-video', items: [] },
                        { title: 'روابط التمارين والتتوريال', type: 'tutorials', icon: 'fa-pen-ruler', items: [] },
                        { title: 'ملفات الفيزياء', type: 'files', icon: 'fa-file-pdf', items: [] }
                    ]
                },
                {
                    id: 'biochem',
                    name: 'الكيمياء الحيويه',
                    doc: 'دكتورة حنان',
                    isGeneral: false,
                    deptId: 'biomedical',
                    buttons: [
                        { title: 'روابط محاضرات الكيمياء الحيوية', type: 'links', icon: 'fa-video', items: [] },
                        { title: 'ملفات الكيمياء الحيوية', type: 'files', icon: 'fa-file-pdf', items: [] }
                    ]
                },
                {
                    id: 'programming',
                    name: 'مبادئ البرمجة',
                    doc: 'دكتورة وسام',
                    isGeneral: true,
                    buttons: [
                        { title: 'روابط المحاضرات', type: 'links', icon: 'fa-video', items: [] },
                        { title: 'روابط محاضرات المعمل (اللاب)', type: 'lab', icon: 'fa-laptop-code', items: [] },
                        { title: 'ملفات البرمجة', type: 'files', icon: 'fa-file-code', items: [] }
                    ]
                },
                {
                    id: 'drawing',
                    name: 'اساسيات الرسم الهندسي',
                    doc: 'د. مصطفى',
                    isGeneral: true,
                    buttons: [
                        { title: 'محاضرات الرسم الهندسي', type: 'links', icon: 'fa-video', items: [] },
                        { title: 'ملفات الرسم الهندسي', type: 'files', icon: 'fa-file-pdf', items: [] }
                    ]
                },
                {
                    id: 'calc2',
                    name: 'الحسبان 2',
                    doc: 'د. هشام',
                    isGeneral: true,
                    buttons: [
                        { title: 'روابط محاضرات الحسبان 2', type: 'links', icon: 'fa-video', items: [] },
                        { title: 'ملفات الحسبان 2', type: 'files', icon: 'fa-file-pdf', items: [] }
                    ]
                },
                {
                    id: 'geometry',
                    name: 'الهندسة التحليلية',
                    doc: 'دكتورة زينب',
                    isGeneral: true,
                    buttons: [
                        { title: 'روابط محاضرات الهندسة التحليلية', type: 'links', icon: 'fa-video', items: [] },
                        { title: 'ملفات الهندسة التحليلية', type: 'files', icon: 'fa-file-pdf', items: [] }
                    ]
                },
                {
                    id: 'english',
                    name: 'اللغة الإنجليزية',
                    doc: 'أستاذ المادة',
                    isGeneral: true,
                    buttons: [
                        { title: 'روابط محاضرات الإنجليزي', type: 'links', icon: 'fa-video', items: [] },
                        { title: 'ملفات وشيتات الإنجليزي', type: 'files', icon: 'fa-file-pdf', items: [] }
                    ]
                }
            ],

            schedule: [
                { day: 'السبت', subjectId: 'physics2', time: '03:00 م - 05:00 م', doc: 'د. الزبير جعفر', type: 'محاضرة' },
                { day: 'الأحد', subjectId: 'drawing', time: '09:00 ص - 11:00 ص', doc: 'د. مصطفى', type: 'محاضرة' },
                { day: 'الأحد', subjectId: 'programming', time: '11:00 ص - 01:00 م', doc: 'دكتورة وسام', type: 'محاضرة' },
                { day: 'الأحد', subjectId: 'geometry', time: '07:00 م - 09:00 م', doc: 'تتوريال', type: 'تتوريال' },
                { day: 'الأربعاء', subjectId: 'biochem', time: '08:00 ص - 10:00 ص', doc: 'دكتورة حنان', type: 'محاضرة (طبية حيوية)' },
                { day: 'الأربعاء', subjectId: 'calc2', time: '10:00 ص - 12:00 م', doc: 'د. هشام', type: 'محاضرة' },
                { day: 'الأربعاء', subjectId: 'geometry', time: '01:00 م - 03:00 م', doc: 'دكتورة زينب', type: 'محاضرة' },
                { day: 'الأربعاء', subjectId: 'programming', time: '03:00 م - 05:00 م', doc: 'دكتورة وسام', type: 'معمل (لاب)' },
                { day: 'الأربعاء', subjectId: 'physics2', time: '07:00 م - 09:00 م', doc: 'د. الزبير جعفر', type: 'تتوريال' }
            ]
        };

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            populateSubjectsDropdown();
            await fetchSheetData();
            renderAll();
            setupModalListeners();
        });

        const themeBtn = document.getElementById('themeBtn');
        function initTheme() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            themeBtn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        themeBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            themeBtn.innerHTML = target === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });

        async function fetchSheetData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("فشل في الاتصال بالسيرفر");
                
                const data = await response.json();
                appData.subjects.forEach(s => s.buttons.forEach(b => b.items = []));

                if (Array.isArray(data)) {
                    data.forEach(item => {
                        const subject = appData.subjects.find(s => s.id === item.subject);
                        if (subject) {
                            const btn = subject.buttons.find(b => b.type === item.button);
                            if (btn) {
                                btn.items.push({ name: item.title, url: item.url });
                            }
                        }
                    });
                }
            } catch (err) {
                console.error("خطأ جلب البيانات:", err);
                const container = document.getElementById('subjectsContainer');
                if (container) {
                    container.innerHTML = `
                        <div class="loading-text" style="color: #ff4d4d;">
                            <i class="fa-solid fa-circle-exclamation"></i> تعذر جلب البيانات الحية من المكتبة.
                            <br><button class="retry-btn" onclick="location.reload()">إعادة المحاولة</button>
                        </div>`;
                }
            }
        }

        function populateSubjectsDropdown() {
            const dept = document.getElementById('deptSelect').value;
            const select = document.getElementById('subjectSelect');
            const filtered = appData.subjects.filter(s => s.isGeneral || dept === 'biomedical');
            select.innerHTML = '<option value="all">جميع المواد</option>' + 
                filtered.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }

        function onFilterChange() {
            populateSubjectsDropdown();
            renderAll();
        }

        function switchTab(id, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        function renderAll() {
            const dept = document.getElementById('deptSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            renderSubjectsView(dept, subject);
            renderSchedule(dept, subject);
        }

        function renderSubjectsView(dept, selectedSubject) {
            const container = document.getElementById('subjectsContainer');
            const filteredSubjects = appData.subjects.filter(s => {
                const passDept = s.isGeneral || (dept === 'biomedical');
                const passSubj = (selectedSubject === 'all') || (s.id === selectedSubject);
                return passDept && passSubj;
            });

            if (filteredSubjects.length === 0) {
                container.innerHTML = `<div class="loading-text">لا توجد مواد مطابقة للخيارات المحددة.</div>`;
                return;
            }

            container.innerHTML = filteredSubjects.map(s => {
                const buttonsHtml = s.buttons.map((btn, idx) => `
                    <button class="sub-btn" onclick="openResourceModal('${s.id}', ${idx})">
                        <span><i class="fa-solid ${btn.icon}"></i> ${btn.title} (${btn.items.length})</span>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                `).join('');

                return `
                    <div class="card">
                        <div>
                            <div class="card-header">
                                <span class="badge ${!s.isGeneral ? 'bio' : ''}">${s.isGeneral ? 'عام' : 'طبية حيوية'}</span>
                            </div>
                            <div class="subject-title">${s.name}</div>
                            <ul class="info-list">
                                <li><i class="fa-solid fa-user-tie"></i> المحاضر: ${s.doc}</li>
                            </ul>
                            <div class="sub-buttons">
                                ${buttonsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openResourceModal(subjectId, buttonIdx) {
            const subject = appData.subjects.find(s => s.id === subjectId);
            if (!subject) return;

            const targetBtn = subject.buttons[buttonIdx];
            document.getElementById('modalTitle').innerText = `${subject.name} - ${targetBtn.title}`;

            const modalBody = document.getElementById('modalBody');
            if (targetBtn.items.length === 0) {
                modalBody.innerHTML = `
                    <p style="color:var(--text-sub); text-align:center; padding:20px;">
                        لا توجد ملفات أو روابط مضافة في قسم <b>${targetBtn.title}</b> حتى الآن.
                    </p>`;
            } else {
                modalBody.innerHTML = targetBtn.items.map(item => `
                    <div class="resource-item">
                        <span style="font-weight:700;">${item.name}</span>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="resource-link">
                            فتح الرابط <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `).join('');
            }

            document.getElementById('resourceModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('resourceModal').classList.remove('active');
        }

        function setupModalListeners() {
            const modal = document.getElementById('resourceModal');
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
            });
        }

        function renderSchedule(dept, selectedSubject) {
            const container = document.getElementById('scheduleContainer');
            const daysOrder = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
            let html = '';

            daysOrder.forEach(day => {
                const dayLectures = appData.schedule.filter(item => {
                    const subjObj = appData.subjects.find(s => s.id === item.subjectId);
                    const isBioOnly = subjObj && !subjObj.isGeneral;
                    const passDept = (dept === 'biomedical') || !isBioOnly;
                    const passSubj = (selectedSubject === 'all') || (item.subjectId === selectedSubject);
                    return item.day === day && passDept && passSubj;
                });

                if (dayLectures.length > 0) {
                    html += `<div class="day-header"><i class="fa-regular fa-clock"></i> يوم ${day}</div>`;
                    html += `<div class="grid">`;
                    dayLectures.forEach(lec => {
                        const subjObj = appData.subjects.find(s => s.id === lec.subjectId);
                        html += `
                            <div class="card">
                                <div>
                                    <div class="card-header">
                                        <span class="badge">${lec.type}</span>
                                        <small style="color:var(--text-sub);">بتوقيت السودان</small>
                                    </div>
                                    <div class="subject-title">${subjObj ? subjObj.name : ''}</div>
                                    <ul class="info-list">
                                        <li><i class="fa-regular fa-user"></i> ${lec.doc}</li>
                                        <li><i class="fa-regular fa-clock"></i> ${lec.time}</li>
                                    </ul>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            });

            container.innerHTML = html || `<div class="loading-text">لا توجد محاضرات في جدول هذا اليوم.</div>`;
        }
    </script>
</body>
</html>
