<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الهندسية الموحدة - الجدول والملفات</title>
    <!-- خط Tajawal الأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #f4f7fe;
            --bg-card: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.9);
            --text-main: #1b2559;
            --text-sub: #707ebe;
            --primary: #4318ff;
            --primary-hover: #3311db;
            --telegram-color: #0088cc;
            --accent: #00d589;
            --border: #e9edf7;
            --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
        }

        [data-theme="dark"] {
            --bg-body: #0b1437;
            --bg-card: #111c44;
            --bg-header: rgba(17, 28, 68, 0.9);
            --text-main: #ffffff;
            --text-sub: #a3edda;
            --primary: #7551ff;
            --primary-hover: #5a32ea;
            --border: #1b254b;
            --shadow: 0px 18px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* الهيدر */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
        }

        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* قسم التصفية */
        .hero {
            text-align: center;
            margin: 30px 0;
        }

        .hero h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .filter-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .filter-item {
            flex: 1;
            min-width: 240px;
        }

        .filter-item label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        /* التبويبات */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 10px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* بطاقات العرض */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            background: var(--bg-body);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--border);
        }

        .badge.bio { color: var(--accent); }

        .subject-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .info-list {
            list-style: none;
            color: var(--text-sub);
            font-size: 0.92rem;
            margin-bottom: 18px;
        }

        .info-list li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-telegram { background: var(--telegram-color); color: white; }
        .btn-telegram:hover { opacity: 0.9; }

        .day-header {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 25px 0 15px 0;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 4px solid var(--primary);
            padding-right: 10px;
        }

        .empty-box {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-wrapper">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>منصة الهندسة الموحدة</span>
            </div>
            <button class="theme-btn" id="themeBtn" title="تبديل المظهر">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>جدول المحاضرات والمكتبة الرقمية</h1>
            <p>اختر القسم أو المادة لعرض المواعيد، روابط المحاضرات، وملفات البوت مباشرة</p>
        </section>

        <!-- التصفية -->
        <div class="filter-card">
            <div class="filter-item">
                <label for="deptSelect"><i class="fa-solid fa-layer-group"></i> القسم الأكاديمي:</label>
                <select id="deptSelect" onchange="onFilterChange()">
                    <option value="all">جميع أقسام الهندسة (مشترك)</option>
                    <option value="biomedical">الهندسة الطبية الحيوية (Biomedical)</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="subjectSelect"><i class="fa-solid fa-book"></i> المادة الدراسية:</label>
                <select id="subjectSelect" onchange="onFilterChange()">
                    <option value="all">عرض جميع المواد</option>
                </select>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('scheduleTab', this)">
                <i class="fa-solid fa-calendar-days"></i> الجدول الأسبوعي
            </button>

            <button class="tab-btn" onclick="switchTab('subjectsTab', this)">
                <i class="fa-solid fa-folder-open"></i> مواد الدفعة ورواط البوت
            </button>
        </div>

        <!-- 1. الجدول الأسبوعي -->
        <div id="scheduleTab" class="tab-content active">
            <div id="scheduleContainer"></div>
        </div>

        <!-- 2. بطاقات المواد مع روابط التلجرام -->
        <div id="subjectsTab" class="tab-content">
            <div id="subjectsContainer" class="grid"></div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           قاعدة البيانات المحدثة بجدول الدفعة الحقيقي (بتوقيت السودان)
           ========================================================================== */
        const appData = {
            // رابط بوت التلجرام الخاص بكم (ضع رابط بوتك هنا بدلاً من الرابط الحالي)
            botLink: "https://t.me/engineeringust24_bot", 

            subjects: [
                { id: 'physics', name: 'الفيزياء (Physics)', doc: 'د. الزبير جعفر', isGeneral: true },
                { id: 'english', name: 'اللغة الإنجليزية (English)', doc: 'دكتورة القوت', isGeneral: true },
                { id: 'drawing', name: 'الرسم الهندسي (Engineering Drawing)', doc: 'د. مصطفى', isGeneral: true },
                { id: 'prog', name: 'البرمجة (Programming C)', doc: 'دكتورة وسام', isGeneral: true },
                { id: 'geom', name: 'الهندسة التحليلية (Analytical Geometry)', doc: 'دكتورة زينب', isGeneral: true },
                { id: 'calc2', name: 'الحسبان 2 (Calculus II)', doc: 'د. هشام', isGeneral: true },
                // مادة مخصصة للطبية الحيوية فقط
                { id: 'biochem', name: 'الكيمياء الحيوية (Biochemistry)', doc: 'دكتورة حنان', isGeneral: false, deptId: 'biomedical' }
            ],

            schedule: [
                // السبت
                { day: 'السبت', subjectId: 'physics', time: '03:00 م - 05:00 م', doc: 'د. الزبير جعفر', type: 'محاضرة' },
                { day: 'السبت', subjectId: 'english', time: '05:00 م - 07:00 م', doc: 'دكتورة القوت', type: 'محاضرة' },
                
                // الأحد
                { day: 'الأحد', subjectId: 'drawing', time: '09:00 ص - 11:00 ص', doc: 'د. مصطفى', type: 'محاضرة' },
                { day: 'الأحد', subjectId: 'prog', time: '11:00 ص - 01:00 م', doc: 'دكتورة وسام', type: 'محاضرة' },
                { day: 'الأحد', subjectId: 'geom', time: '07:00 م - 09:00 م', doc: 'تتوريال', type: 'تتوريال' },

                // الأربعاء
                { day: 'الأربعاء', subjectId: 'biochem', time: '08:00 ص - 10:00 ص', doc: 'دكتورة حنان', type: 'محاضرة (طبية حيوية)' },
                { day: 'الأربعاء', subjectId: 'calc2', time: '10:00 ص - 12:00 م', doc: 'د. هشام', type: 'محاضرة' },
                { day: 'الأربعاء', subjectId: 'geom', time: '01:00 م - 03:00 م', doc: 'دكتورة زينب', type: 'محاضرة' },
                { day: 'الأربعاء', subjectId: 'prog', time: '03:00 م - 05:00 م', doc: 'دكتورة وسام', type: 'معمل (لاب)' },
                { day: 'الأربعاء', subjectId: 'physics', time: '07:00 م - 09:00 م', doc: 'د. الزبير جعفر', type: 'تتوريال' }
            ]
        };

        // التهيئة عند التحميل
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            populateSubjectsDropdown();
            renderAll();
        });

        // 1. الوضع المظلم
        const themeBtn = document.getElementById('themeBtn');
        function initTheme() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            themeBtn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        themeBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            themeBtn.innerHTML = target === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });

        // 2. تعبئة قائمة المواد
        function populateSubjectsDropdown() {
            const dept = document.getElementById('deptSelect').value;
            const select = document.getElementById('subjectSelect');
            
            const filtered = appData.subjects.filter(s => s.isGeneral || dept === 'biomedical');
            select.innerHTML = '<option value="all">عرض جميع المواد</option>' + 
                filtered.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }

        function onFilterChange() {
            populateSubjectsDropdown();
            renderAll();
        }

        function switchTab(id, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        // 3. عرض البيانات
        function renderAll() {
            const dept = document.getElementById('deptSelect').value;
            const subject = document.getElementById('subjectSelect').value;

            renderSchedule(dept, subject);
            renderSubjectsView(dept, subject);
        }

        function renderSchedule(dept, selectedSubject) {
            const container = document.getElementById('scheduleContainer');
            const daysOrder = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
            let html = '';

            daysOrder.forEach(day => {
                const dayLectures = appData.schedule.filter(item => {
                    const subjObj = appData.subjects.find(s => s.id === item.subjectId);
                    const isBioOnly = subjObj && !subjObj.isGeneral;
                    
                    // فلترة القسم والمادة
                    const passDept = (dept === 'biomedical') || !isBioOnly;
                    const passSubj = (selectedSubject === 'all') || (item.subjectId === selectedSubject);

                    return item.day === day && passDept && passSubj;
                });

                if (dayLectures.length > 0) {
                    html += `<div class="day-header"><i class="fa-regular fa-clock"></i> يوم ${day}</div>`;
                    html += `<div class="grid">`;
                    dayLectures.forEach(lec => {
                        const subjObj = appData.subjects.find(s => s.id === lec.subjectId);
                        const isBio = subjObj && !subjObj.isGeneral;
                        html += `
                            <div class="card">
                                <div>
                                    <div class="card-header">
                                        <span class="badge ${isBio ? 'bio' : ''}">${lec.type}</span>
                                        <small style="color:var(--text-sub);"><i class="fa-solid fa-location-dot"></i> بتوقيت السودان</small>
                                    </div>
                                    <div class="subject-title">${subjObj ? subjObj.name : ''}</div>
                                    <ul class="info-list">
                                        <li><i class="fa-regular fa-user"></i> الأستاذ: ${lec.doc}</li>
                                        <li><i class="fa-regular fa-clock"></i> الزمن: ${lec.time}</li>
                                    </ul>
                                </div>
                                <div class="action-btns">
                                    <a href="${appData.botLink}" target="_blank" class="btn btn-telegram">
                                        <i class="fa-brands fa-telegram"></i> فتح ملفات المادة في البوت
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            });

            if (!html) {
                if (['الإثنين', 'الثلاثاء'].includes(daysOrder)) {
                    html = `<div class="empty-box">لا توجد محاضرات في هذا اليوم (عطلة/أوف)</div>`;
                } else {
                    html = `<div class="empty-box"><i class="fa-solid fa-calendar-xmark"></i> لا توجد محاضرات مطابقة لخيارات البحث.</div>`;
                }
            }

            container.innerHTML = html;
        }

        function renderSubjectsView(dept, selectedSubject) {
            const container = document.getElementById('subjectsContainer');
            
            const filteredSubjects = appData.subjects.filter(s => {
                const passDept = s.isGeneral || (dept === 'biomedical');
                const passSubj = (selectedSubject === 'all') || (s.id === selectedSubject);
                return passDept && passSubj;
            });

            if (filteredSubjects.length === 0) {
                container.innerHTML = `<div class="empty-box">لا توجد مواد للعرض.</div>`;
                return;
            }

            container.innerHTML = filteredSubjects.map(s => {
                // البحث عن مواعيد هذه المادة في الجدول
                const times = appData.schedule.filter(sch => sch.subjectId === s.id);
                const timesText = times.map(t => `${t.day} (${t.time})`).join(' | ');

                return `
                    <div class="card">
                        <div>
                            <div class="card-header">
                                <span class="badge ${!s.isGeneral ? 'bio' : ''}">${s.isGeneral ? 'مادة مشتركة' : 'طبية حيوية'}</span>
                            </div>
                            <div class="subject-title">${s.name}</div>
                            <ul class="info-list">
                                <li><i class="fa-solid fa-user-tie"></i> المحاضر: ${s.doc}</li>
                                <li><i class="fa-regular fa-calendar"></i> المواعيد: ${timesText || 'غير محدد'}</li>
                            </ul>
                        </div>
                        <div class="action-btns">
                            <a href="${appData.botLink}" target="_blank" class="btn btn-telegram">
                                <i class="fa-brands fa-telegram"></i> مكتبة الشيتات والملفات (البوت)
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
