<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة كلية الهندسة</title>
<meta name="description" content="محاضرات وتمارين وامتحانات كل تخصصات الهندسة، لكل الفصول الدراسية.">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fffdf9;--tx:#15130e;--sub:#6b665a;--bd:#e4dece;--a:#8a6a2b;--b:#b8913f;--c:#d9bd7c;--glass:rgba(246,243,236,.82);--sh:0 24px 60px rgba(60,45,10,.12)}
:root[data-theme=dark]{--bg:#070a12;--card:#0d1220;--tx:#f4efe4;--sub:#8f93a1;--bd:#1b2236;--a:#b8913f;--b:#e3c98a;--c:#f6e7bd;--glass:rgba(7,10,18,.74);--sh:0 24px 60px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;overflow-x:hidden;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.grad{background:linear-gradient(110deg,var(--a),var(--b) 50%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--bd)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:800;font-size:1.05rem}
.tbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card)}
/* hero */
.hero{position:relative;min-height:92vh;display:grid;place-items:center;text-align:center;overflow:hidden}
.hero-in{position:relative;z-index:2;padding:60px 0;will-change:transform,opacity}
.hero h1{font-size:clamp(2.6rem,8.5vw,5.8rem);font-weight:800;line-height:1.15;letter-spacing:-.02em;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.hero p{font-size:clamp(1.05rem,2.6vw,1.4rem);color:var(--sub);max-width:34ch;margin:22px auto 0;animation:rise 1.1s .25s cubic-bezier(.2,.7,.2,1) both}
.cta{display:inline-block;margin-top:34px;padding:14px 34px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:700;text-decoration:none;animation:rise 1.1s .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .25s}
.cta:hover{transform:scale(1.05)}
.stats{display:flex;gap:44px;justify-content:center;margin-top:54px;animation:rise 1.1s .75s cubic-bezier(.2,.7,.2,1) both}
.stats b{display:block;font-size:2.2rem;font-weight:800;line-height:1.2}
.stats span{color:var(--sub);font-size:.9rem}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:float 16s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--a);top:-8%;right:-6%}
.b2{width:380px;height:380px;background:#24467f;bottom:-10%;left:-4%;animation-delay:-5s}
.b3{width:300px;height:300px;background:var(--c);top:38%;left:36%;opacity:.28;animation-delay:-9s}
@keyframes float{to{transform:translate(50px,-40px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
/* steps */
.step{padding:110px 0 30px}
.step h2{font-size:clamp(2rem,5.5vw,3.6rem);font-weight:800;line-height:1.25;letter-spacing:-.015em}
.step .lead{color:var(--sub);font-size:1.15rem;margin-top:10px;max-width:46ch}
.rv{opacity:0;transform:translateY(36px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*60ms)}
.rv.in{opacity:1;transform:none}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:44px}
.dept{position:relative;text-align:right;padding:28px 24px;border-radius:26px;background:var(--card);border:1px solid var(--bd);overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.dept::before{content:"";position:absolute;inset:auto -30% -60% auto;width:180px;height:180px;border-radius:50%;background:var(--k);opacity:.16;filter:blur(30px);transition:opacity .35s,transform .5s}
.dept:hover{transform:translateY(-6px);box-shadow:var(--sh);border-color:var(--k)}
.dept:hover::before{opacity:.45;transform:scale(1.4)}
.dept[aria-pressed=true]{border-color:var(--k);box-shadow:0 0 0 2px var(--k)}
.dept .ic{font-size:2.4rem;display:block;margin-bottom:14px}
.dept strong{font-size:1.25rem;font-weight:800}
.sems{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.sem{min-width:92px;padding:16px 20px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-weight:700;transition:transform .25s,background .25s,color .25s}
.sem small{display:block;color:var(--sub);font-weight:400;font-size:.78rem;transition:color .25s}
.sem b{font-size:1.5rem;display:block;line-height:1.2}
.sem:hover{transform:translateY(-4px)}
.sem[aria-pressed=true]{background:linear-gradient(135deg,var(--a),var(--b));color:#1a1405;border-color:transparent}
.sem[aria-pressed=true] small{color:#1a1405cc}
.search{width:100%;max-width:440px;margin-top:30px;padding:14px 20px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;outline:none;transition:border-color .25s,box-shadow .25s}
.search:focus{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 22%,transparent)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:34px}
.sub{text-align:right;padding:26px;border-radius:26px;background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.sub:hover{transform:translateY(-5px);box-shadow:var(--sh)}
.sub h3{font-size:1.4rem;font-weight:800}
.sub .doc{color:var(--sub);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:.82rem;font-weight:700;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--b) 14%,transparent);color:var(--b)}
.chip.zero{background:var(--bd);color:var(--sub);font-weight:500}
.empty{color:var(--sub);padding:40px 0;grid-column:1/-1;font-size:1.05rem}
.empty button{margin-top:12px;padding:9px 20px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:700}
/* schedule */
.day{margin-top:34px}
.day h3{font-size:1.5rem;font-weight:800;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding:16px 22px;border-radius:18px;background:var(--card);border:1px solid var(--bd);margin-bottom:10px}
.row b{font-size:1.05rem}
.row span{color:var(--sub);font-size:.92rem}
/* modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:84vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:26px 24px 40px;animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:28px}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh-h h3{font-size:1.4rem;font-weight:800}
.x{width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:1.3rem}
.grp{margin-top:22px;font-weight:800;color:var(--sub);font-size:.95rem}
.res{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;margin-top:8px;border-radius:16px;background:var(--bg);color:var(--tx);text-decoration:none;font-weight:700;transition:transform .2s,color .2s}
.res:hover{transform:translateX(-4px);color:var(--a)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 22px;border-radius:99px;font-size:.9rem;z-index:200}
footer{padding:80px 0 50px;text-align:center;color:var(--sub);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
.fld{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-top:8px}
.btn{padding:10px 20px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:700;margin-top:10px;margin-inline-end:8px}
.btn.dng{background:#e5484d;color:#fff}
.ar{margin:10px 0}
details{background:var(--bg);border-radius:16px;padding:12px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:700}
details .res{background:var(--card)}
.res .btn{margin:0;padding:6px 14px;font-size:.85rem}
.hero .grad,.stats .grad{background:linear-gradient(110deg,var(--a),var(--c),var(--b),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:200% 0}}
#pg{position:fixed;top:0;right:0;left:0;height:2px;z-index:60;background:linear-gradient(90deg,var(--a),var(--c));transform-origin:right;transform:scaleX(0)}
.dept::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--k) 24%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.dept:hover::after{opacity:1}
.btn.gb{display:block;width:100%;background:#fff;color:#1f1f1f;border:1px solid #dadce0;margin:0}
.or{text-align:center;color:var(--sub);margin:14px 0 2px}
.lnk{color:var(--a);font-weight:700;margin-top:10px}
</style>
</head>
<body>
<i id="pg"></i>
<nav><div class="wrap"><span class="logo grad">مكتبة الهندسة</span><div style="display:flex;gap:8px"><button class="tbtn" id="ab" style="width:auto;padding:0 14px;font-size:.85rem">تسجيل الدخول</button><button class="tbtn" id="tb" aria-label="تبديل المظهر">🌙</button></div></div></nav>

<header class="hero">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <div class="wrap hero-in" id="hi">
    <h1>كل محاضراتك.<br><span class="grad">في مكان واحد.</span></h1>
    <p>اختر تخصصك، ثم فصلك، وابدأ من حيث توقفت.</p>
    <a class="cta" href="#s-dept">ابدأ الآن</a>
    <div class="stats"><div><b class="grad">8</b><span>تخصصات</span></div><div><b class="grad">10</b><span>فصول</span></div><div><b class="grad" id="nf">0</b><span>ملف ورابط</span></div></div>
  </div>
</header>

<main>
<section class="step wrap" id="s-dept">
  <h2 class="rv">ما <span class="grad">تخصصك؟</span></h2>
  <p class="lead rv" style="--i:1">المواد المشتركة بين التخصصات تظهر لك تلقائياً.</p>
  <div class="depts" id="depts"></div>
</section>

<section class="step wrap" id="s-sem" hidden>
  <h2 class="rv">في أي <span class="grad">فصل؟</span></h2>
  <div class="sems" id="sems"></div>
</section>

<section class="step wrap" id="s-sub" hidden>
  <h2 class="rv" id="subT">موادك</h2>
  <input class="search rv" id="q" type="search" placeholder="ابحث عن مادة أو ملف" aria-label="بحث" style="--i:1">
  <div class="subs" id="subs"></div>
</section>

<section class="step wrap" id="s-sch" hidden>
  <h2 class="rv">جدول <span class="grad">المحاضرات</span></h2>
  <p class="lead rv" style="--i:1">بتوقيت السودان.</p>
  <div id="sch"></div>
</section>
</main>

<footer>مكتبة طلاب كلية الهندسة</footer>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sheet"><div class="sh-h"><h3 id="mt"></h3><button class="x" id="mx" aria-label="إغلاق">&times;</button></div><div id="mb"></div></div></div>

<div class="ov" id="ad" role="dialog" aria-modal="true"><div class="sheet" style="max-width:720px"><div class="sh-h"><h3 id="at"></h3><button class="x" id="ax" aria-label="إغلاق">&times;</button></div><div id="ab2"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://pgmqxwfwskdmutgqnfgr.supabase.co",SB_KEY="sb_publishable_pFny7MIygUqxdYwa4XEXaQ_30J_35mb";
const OLD_API="https://script.google.com/macros/s/AKfycbxNZjJbNQ-l7rtWHKSlD_zz3CTGCojgo9OiFF9jQmO9CsoJ-yJuPC4v7JiHFheXLN4/exec";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce'}});
const DEPTS=[["biomed","الطبية الحيوية","🩺","#c2566b"],["civil","المدنية","🏗️","#c08a3e"],["software","البرمجيات","💻","#4a90b8"],["electronic","الإلكترونية","🔌","#b8a23e"],["arch","العمارة","📐","#c0703e"],["chemical","الكيميائية","⚗️","#4a9c7a"],["telecom","الاتصالات","📡","#5a7fc0"],["mechatronics","الميكاترونكس","🤖","#8aa04a"]];
const TYPES={links:"المحاضرات",tutorials:"التمارين والتتوريال",files:"الملفات",lab:"المعمل",exams:"الامتحانات"};
const LEGACY={physics2:["الفيزياء 2","د. الزبير جعفر","common"],biochem:["الكيمياء الحيوية","د. حنان","biomed"],programming:["مبادئ البرمجة","د. وسام","common"],drawing:["أساسيات الرسم الهندسي","د. مصطفى","common"],calc2:["الحسبان 2","د. هشام","common"],geometry:["الهندسة التحليلية","د. زينب","common"],english:["اللغة الإنجليزية","أستاذ المادة","common"]};
const SCHED=[["السبت","physics2","03:00 م - 05:00 م","محاضرة"],["الأحد","drawing","09:00 ص - 11:00 ص","محاضرة"],["الأحد","programming","11:00 ص - 01:00 م","محاضرة"],["الأحد","geometry","07:00 م - 09:00 م","تتوريال"],["الأربعاء","biochem","08:00 ص - 10:00 ص","محاضرة"],["الأربعاء","calc2","10:00 ص - 12:00 م","محاضرة"],["الأربعاء","geometry","01:00 م - 03:00 م","محاضرة"],["الأربعاء","programming","03:00 م - 05:00 م","معمل"],["الأربعاء","physics2","07:00 م - 09:00 م","تتوريال"]];
const DAYS=["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];
const SEMS=[...Array(10)].map((_,i)=>[i+1,"الفصل "+(i+1)]);
const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const okUrl=u=>/^https?:\/\//i.test(String(u||"").trim());
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const dn=d=>d==="common"?"مشترك":(DEPTS.find(x=>x[0]===d)||[0,d])[1];
let st={dept:null,sem:null,db:{s:[],r:[],sc:[]},subjects:[],ok:false};
const root=document.documentElement;
function theme(t){root.dataset.theme=t;$("tb").textContent=t==="dark"?"☀️":"🌙";store.set("theme",t)}
theme(store.get("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));
$("tb").onclick=()=>theme(root.dataset.theme==="dark"?"light":"dark");

function build(){
  const by={};st.db.r.forEach(r=>{if(okUrl(r.url))(by[r.subject_id]=by[r.subject_id]||[]).push(r)});
  st.subjects=st.db.s.map(s=>{const items={};(by[s.id]||[]).forEach(r=>(items[r.type]=items[r.type]||[]).push(r));return{id:s.id,dept:s.dept,sem:s.semester,name:s.name,doc:s.doctor||"",items}});
  $("nf").textContent=st.db.r.filter(r=>okUrl(r.url)).length;
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
const watch=el=>el.querySelectorAll(".rv").forEach(x=>io.observe(x));
document.querySelectorAll(".rv").forEach(x=>io.observe(x));
DEPTS.forEach((d,i)=>{
  const b=h("button","dept rv");b.style.setProperty("--k",d[3]);b.style.setProperty("--i",i);b.setAttribute("aria-pressed","false");b.dataset.k=d[0];
  b.append(h("span","ic",d[2]),h("strong","",d[1]));b.onclick=()=>pick(d[0],null,true);$("depts").append(b);io.observe(b);
});
for(let i=1;i<=10;i++){
  const b=h("button","sem rv");b.style.setProperty("--i",i);b.setAttribute("aria-pressed","false");b.dataset.k=i;
  b.append(h("small","","الفصل"),h("b","",i));b.onclick=()=>pick(st.dept,i,true);$("sems").append(b);
}
function pick(dept,sem,scroll){
  st.dept=dept;st.sem=sem;
  document.querySelectorAll(".dept").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===dept));
  document.querySelectorAll(".sem").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.k===sem));
  if(dept)reveal("s-sem",scroll&&!sem);
  if(dept&&sem){renderSubs();renderSched();reveal("s-sub",scroll);$("s-sch").hidden=false;watch($("s-sch"))}
  history.replaceState(null,"","#"+dept+(sem?"/"+sem:""));
}
function reveal(id,go){const s=$(id);s.hidden=false;watch(s);if(go)setTimeout(()=>s.scrollIntoView({behavior:"smooth"}),60)}
function visible(){return st.subjects.filter(s=>s.sem===st.sem&&(s.dept==="common"||s.dept===st.dept))}
function renderSubs(){
  const q=$("q").value.trim().toLowerCase(),box=$("subs");
  $("subT").textContent="مواد "+dn(st.dept)+" · الفصل "+st.sem;box.replaceChildren();
  const list=visible().filter(s=>!q||s.name.toLowerCase().includes(q)||Object.values(s.items).flat().some(i=>String(i.title).toLowerCase().includes(q)));
  if(!list.length){
    const e=h("div","empty",q?"لا توجد نتائج لهذا البحث.":"لم تُضف مواد لهذا الفصل بعد.");
    if(!st.ok){const r=h("button","","إعادة المحاولة");r.onclick=load;e.append(h("br"),r)}
    box.append(e);return;
  }
  list.forEach((s,i)=>{
    const c=h("button","sub rv");c.style.setProperty("--i",i%6);
    c.append(h("h3","",s.name),h("span","doc",s.doc?"المحاضر: "+s.doc:"—"));
    const ch=h("div","chips");let tot=0;
    Object.keys(TYPES).forEach(t=>{const n=(s.items[t]||[]).length;if(n){tot+=n;ch.append(h("span","chip",TYPES[t]+" "+n))}});
    if(!tot)ch.append(h("span","chip zero","لا ملفات بعد"));
    c.append(ch);c.onclick=()=>openSheet(s);box.append(c);io.observe(c);
  });
}
$("q").oninput=()=>st.dept&&st.sem&&renderSubs();
function renderSched(){
  const box=$("sch");box.replaceChildren();
  const vis=new Map(visible().map(s=>[s.id,s.name]));let any=false;
  DAYS.forEach(d=>{
    const rows=st.db.sc.filter(x=>x.day===d&&vis.has(x.subject_id));if(!rows.length)return;any=true;
    const w=h("div","day rv");w.append(h("h3","","يوم "+d));
    rows.forEach(x=>{const r=h("div","row");r.append(h("b","",vis.get(x.subject_id)+" · "+x.kind),h("span","",x.time));w.append(r)});
    box.append(w);io.observe(w);
  });
  if(!any)box.append(h("div","empty","لم يُضف جدول هذا الفصل بعد."));
}
function openSheet(s){
  $("mt").textContent=s.name;const b=$("mb");b.replaceChildren();let n=0;
  Object.keys(TYPES).forEach(t=>{
    const it=s.items[t];if(!it)return;n+=it.length;b.append(h("div","grp",TYPES[t]));
    it.forEach(x=>{const a=h("a","res");a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";a.append(h("span","",x.title),h("span","","↗"));b.append(a)});
  });
  if(!n)b.append(h("p","empty","لا توجد ملفات لهذه المادة حتى الآن."));
  $("ov").classList.add("on");$("mx").focus();
}
const close=()=>{$("ov").classList.remove("on");$("ad").classList.remove("on")};
$("mx").onclick=close;$("ax").onclick=close;
$("ov").onclick=e=>{if(e.target===$("ov"))close()};
addEventListener("keydown",e=>e.key==="Escape"&&close());
function toast(t){const e=h("div","toast",t);document.body.append(e);setTimeout(()=>e.remove(),3500)}

async function load(){
  const c=store.get("lib_v3");
  if(c&&!st.db.s.length){try{st.db=JSON.parse(c);build();refresh()}catch(e){}}
  try{
    const [s,r,sc]=await Promise.all([sb.from("subjects").select("*").order("semester").order("name").range(0,4999),sb.from("resources").select("*").order("id").range(0,4999),sb.from("schedule").select("*").range(0,4999)]);
    if(s.error||r.error||sc.error)throw 0;
    st.db={s:s.data,r:r.data,sc:sc.data};st.ok=true;store.set("lib_v3",JSON.stringify(st.db));
  }catch(e){toast(st.db.s.length?"تعذّر التحديث، تُعرض نسخة محفوظة":"تعذّر جلب البيانات. تحقق من الاتصال.")}
  build();refresh();
}
function refresh(){if(st.dept&&st.sem){renderSubs();renderSched()}}
(function(){const m=location.hash.slice(1).split("/");if(DEPTS.some(d=>d[0]===m[0])){const s=+m[1];pick(m[0],s>=1&&s<=10?s:null,false)}})();
const hi=$("hi");let tk=false;
addEventListener("scroll",()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{const y=Math.min(scrollY,700);hi.style.opacity=1-y/650;hi.style.transform="translateY("+y*.22+"px) scale("+(1-y/3500)+")";$("pg").style.transform="scaleX("+(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))+")";tk=false})},{passive:true});

/* الأدمن */
const adm={on:false,f:0,open:null};
const inp=(p,t)=>{const e=h("input","fld");e.placeholder=p;e.type=t||"text";if(t==="email"||t==="password")e.dir="ltr";return e};
const sel=o=>{const e=h("select","fld");o.forEach(x=>{const p=h("option","",x[1]);p.value=x[0];e.append(p)});return e};
const btn=(t,fn,c)=>{const e=h("button","btn "+(c||""),t);e.onclick=fn;return e};
async function checkAdmin(){
  adm.on=false;adm.user=false;const {data:{session}}=await sb.auth.getSession();
  if(session){adm.user=true;const {data}=await sb.rpc("is_admin");adm.on=data===true}
  $("ab").textContent=adm.on?"⚙️ لوحة التحكم":adm.user?"تسجيل الخروج":"تسجيل الدخول";
}
sb.auth.onAuthStateChange(()=>setTimeout(checkAdmin,0));
$("ab").onclick=async()=>{if(adm.on)openAdmin();else if(adm.user){await sb.auth.signOut();await checkAdmin();toast("تم تسجيل الخروج")}else openLogin()};
function openLogin(mode){
  mode=mode||"in";const b=$("ab2");b.replaceChildren();$("at").textContent=mode==="in"?"تسجيل الدخول":"إنشاء حساب";$("ad").classList.add("on");
  const g=btn("المتابعة بحساب Google",()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}}),"gb");
  const e=inp("البريد الإلكتروني","email"),p=inp("كلمة السر","password");
  const go=btn(mode==="in"?"دخول":"إنشاء الحساب",async()=>{
    const em=e.value.trim();if(!em||p.value.length<6)return toast("أدخل البريد وكلمة سر لا تقل عن 6 أحرف");
    if(mode==="in"){const {error}=await sb.auth.signInWithPassword({email:em,password:p.value});if(error)return toast("بيانات الدخول غير صحيحة")}
    else{const {data,error}=await sb.auth.signUp({email:em,password:p.value,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return toast(error.message);if(!data.session){close();return toast("أُرسل رابط التأكيد إلى بريدك، افتحه ثم سجّل الدخول")}}
    await checkAdmin();if(adm.on)openAdmin();else{close();toast("مرحباً بك")}
  });
  const sw=h("button","lnk",mode==="in"?"ليس لديك حساب؟ أنشئ حساباً":"لديك حساب؟ سجّل الدخول");sw.onclick=()=>openLogin(mode==="in"?"up":"in");
  b.append(g,h("div","or","أو"),e,p,go,h("br"),sw);
}
async function importOld(){
  if(!confirm("استيراد بيانات الشيت القديم (الفصل 2)؟"))return;
  try{
    const old=await (await fetch(OLD_API)).json();
    for(const id in LEGACY){const L=LEGACY[id];if(!st.db.s.some(x=>x.name===L[0]&&x.semester===2)){const {error}=await sb.from("subjects").insert({dept:L[2],semester:2,name:L[0],doctor:L[1]});if(error)throw error}}
    await load();
    const idOf=n=>(st.db.s.find(x=>x.semester===2&&x.name===n)||{}).id;
    const rows=[];
    old.forEach(o=>{const L=LEGACY[o.subject];if(!L||!okUrl(o.url))return;const sid=idOf(L[0]);if(sid&&!st.db.r.some(r=>r.subject_id===sid&&r.url===o.url))rows.push({subject_id:sid,type:o.button,title:o.title,url:o.url})});
    if(rows.length){const {error}=await sb.from("resources").insert(rows);if(error)throw error}
    if(!st.db.sc.length){const sc=SCHED.map(x=>({subject_id:idOf(LEGACY[x[1]][0]),day:x[0],time:x[2],kind:x[3]})).filter(x=>x.subject_id);const {error}=await sb.from("schedule").insert(sc);if(error)throw error}
    toast("تم الاستيراد");await load();openAdmin();
  }catch(e){toast("فشل الاستيراد: "+(e.message||""))}
}
async function openAdmin(){
  const b=$("ab2");b.replaceChildren();$("at").textContent="لوحة التحكم";$("ad").classList.add("on");
  const ok=async p=>{const {error}=await p;if(error){toast(error.message);return}await load();openAdmin()};
  b.append(h("div","grp","إضافة مادة"));
  const dd=sel([["common","مشترك"],...DEPTS.map(x=>[x[0],x[1]])]),ss=sel(SEMS),nn=inp("اسم المادة"),dc=inp("اسم المحاضر (اختياري)");
  b.append(dd,ss,nn,dc,btn("إضافة المادة",()=>nn.value.trim()&&ok(sb.from("subjects").insert({dept:dd.value,semester:+ss.value,name:nn.value.trim(),doctor:dc.value.trim()}))));
  b.append(h("div","grp","المواد والملفات"));
  const fs=sel([[0,"كل الفصول"],...SEMS]);fs.value=adm.f;fs.onchange=()=>{adm.f=+fs.value;openAdmin()};b.append(fs);
  st.db.s.filter(s=>!adm.f||s.semester===adm.f).forEach(s=>{
    const dt=h("details");dt.open=adm.open===s.id;dt.ontoggle=()=>{if(dt.open)adm.open=s.id};
    dt.append(h("summary","","ف"+s.semester+" · "+s.name+" · "+dn(s.dept)));
    const row=h("div","ar");
    row.append(btn("تعديل",async()=>{const n=prompt("اسم المادة",s.name);if(n===null)return;const d=prompt("المحاضر",s.doctor||"");if(d===null)return;ok(sb.from("subjects").update({name:n.trim()||s.name,doctor:d.trim()}).eq("id",s.id))}),
      btn("حذف المادة",async()=>{if(!confirm("حذف المادة وكل ملفاتها؟"))return;const fp=st.db.r.filter(r=>r.subject_id===s.id&&r.file_path).map(r=>r.file_path);if(fp.length)await sb.storage.from("files").remove(fp);ok(sb.from("subjects").delete().eq("id",s.id))},"dng"));
    dt.append(row);
    st.db.r.filter(r=>r.subject_id===s.id).forEach(r=>{
      const x=h("div","res");x.append(h("span","",(TYPES[r.type]||r.type)+" · "+r.title),btn("حذف",async()=>{if(!confirm("حذف هذا الملف؟"))return;if(r.file_path)await sb.storage.from("files").remove([r.file_path]);ok(sb.from("resources").delete().eq("id",r.id))},"dng"));dt.append(x);
    });
    const ty=sel(Object.entries(TYPES)),t=inp("عنوان الملف"),u=inp("رابط (Drive أو يوتيوب) أو ارفع ملفاً بالأسفل","url"),fi=h("input","fld");fi.type="file";
    dt.append(h("div","grp","إضافة ملف"),ty,t,u,fi,btn("إضافة",async()=>{
      const f=fi.files[0];let url=u.value.trim(),fp=null;
      if(!t.value.trim()||(!f&&!okUrl(url)))return toast("اكتب العنوان وأضف رابطاً أو ملفاً");
      if(f){if(f.size>50*1024*1024)return toast("الملف أكبر من 50 ميجا");
        fp=s.id+"/"+Date.now()+"-"+f.name.replace(/[^A-Za-z0-9._-]/g,"_");
        const up=await sb.storage.from("files").upload(fp,f);if(up.error)return toast(up.error.message);
        url=sb.storage.from("files").getPublicUrl(fp).data.publicUrl}
      adm.open=s.id;ok(sb.from("resources").insert({subject_id:s.id,type:ty.value,title:t.value.trim(),url,file_path:fp}));
    }));
    b.append(dt);
  });
  b.append(h("div","grp","جدول المحاضرات"));
  st.db.sc.forEach(x=>{const s=st.db.s.find(y=>y.id===x.subject_id);if(!s||(adm.f&&s.semester!==adm.f))return;
    const r=h("div","res");r.append(h("span","",x.day+" · "+s.name+" · "+x.time+" · "+x.kind),btn("حذف",()=>ok(sb.from("schedule").delete().eq("id",x.id)),"dng"));b.append(r)});
  const sj=sel(st.db.s.map(s=>[s.id,"ف"+s.semester+" · "+s.name])),dy=sel(DAYS.map(d=>[d,d])),tm=inp("الوقت مثل 09:00 ص - 11:00 ص"),kd=sel([["محاضرة","محاضرة"],["تتوريال","تتوريال"],["معمل","معمل"]]);
  b.append(sj,dy,tm,kd,btn("إضافة للجدول",()=>tm.value.trim()&&sj.value&&ok(sb.from("schedule").insert({subject_id:+sj.value,day:dy.value,time:tm.value.trim(),kind:kd.value}))));
  b.append(h("div","grp","أدوات"),btn("استيراد بيانات الشيت القديم",importOld),btn("تسجيل الخروج",async()=>{await sb.auth.signOut();await checkAdmin();close()},"dng"));
}
$("depts").addEventListener("pointermove",e=>{const c=e.target.closest(".dept");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")});
checkAdmin();load();

</script>
